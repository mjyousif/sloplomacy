steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_SUPABASE_URL=$_SUPABASE_URL'
      - '--build-arg'
      - 'VITE_SUPABASE_ANON_KEY=$_SUPABASE_ANON_KEY'
      - '--build-arg'
      - 'VITE_GIT_COMMIT=$_SHORT_SHA'
      - '-t'
      - '$_IMAGE_TAG'
      - '.'
images:
  - '$_IMAGE_TAG'
substitutions:
  _SUPABASE_URL: ''
  _SUPABASE_ANON_KEY: ''
  _SHORT_SHA: ''
  _REGION: 'us-central1'
  _IMAGE_TAG: 'us-central1-docker.pkg.dev/$PROJECT_ID/diplomacy-repo/diplomacy-1901:latest'
options:
  logging: CLOUD_LOGGING_ONLY
