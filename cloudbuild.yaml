steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_SUPABASE_URL=$_SUPABASE_URL'
      - '--build-arg'
      - 'VITE_SUPABASE_ANON_KEY=$_SUPABASE_ANON_KEY'
      - '-t'
      - '$_IMAGE_TAG'
      - '.'
images:
  - '$_IMAGE_TAG'
substitutions:
  _SUPABASE_URL: ''
  _SUPABASE_ANON_KEY: ''
  _IMAGE_TAG: 'gcr.io/$PROJECT_ID/diplomacy-1901:latest'
options:
  logging: CLOUD_LOGGING_ONLY
