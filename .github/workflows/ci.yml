name: CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Backend Lint & Format Check (Ruff)
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend Lint & Format Check (Biome & tsc)
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
        working-directory: frontend

  backend-tests:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        run: |
          pytest -v

  frontend-tests:
    name: Frontend Tests & Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript typecheck & Vitest
        run: |
          npm test
          npm run build

  deploy:
    name: Deploy to Google Cloud Run
    needs: [code-quality, backend-tests, frontend-tests]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Deployment Secrets
        run: |
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "::error::Missing secret 'GCP_PROJECT_ID'. Add it under GitHub Repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "::error::Missing secret 'GCP_SA_KEY'. Add it under GitHub Repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      # A failed migration stops the deploy. Every file runs in one transaction, so a failure
      # leaves the database as it was, and no other connection sees a half-applied policy set.
      - name: Apply Supabase Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL not configured. Skipping migrations."
            exit 0
          fi
          files=()
          for sql_file in $(ls -1 supabase/migrations/*.sql | sort); do
            echo "--> Will run migration: $sql_file"
            files+=(-f "$sql_file")
          done
          echo "Applying migrations to Supabase PostgreSQL..."
          if ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction "${files[@]}"; then
            echo "::error::Migrations failed and were rolled back, so nothing was deployed. If DATABASE_URL uses the direct 'db.<ref>.supabase.co' host, switch it to the IPv4 Connection Pooler URI (aws-0-<region>.pooler.supabase.com:6543) from the Supabase 'Connect' modal, because GitHub Actions runners do not support IPv6."
            exit 1
          fi
          echo "Migrations applied."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure Artifact Registry Repository Exists
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          REPO_NAME: ${{ secrets.GCP_ARTIFACT_REPO || 'diplomacy-repo' }}
        run: |
          if ! gcloud artifacts repositories describe "$REPO_NAME" --location="$REGION" --project="$PROJECT_ID" &>/dev/null; then
            echo "Creating Artifact Registry repository '$REPO_NAME'..."
            gcloud artifacts repositories create "$REPO_NAME" \
              --repository-format=docker \
              --location="$REGION" \
              --description="Docker repository for Sloplomacy 1901" \
              --project="$PROJECT_ID"
          fi

      - name: Configure Docker for Artifact Registry
        env:
          REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build & Push Container Image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          SERVICE_NAME: ${{ secrets.GCP_SERVICE_NAME || 'diplomacy-1901' }}
          REPO_NAME: ${{ secrets.GCP_ARTIFACT_REPO || 'diplomacy-repo' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Google Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          SERVICE_NAME: ${{ secrets.GCP_SERVICE_NAME || 'diplomacy-1901' }}
          REPO_NAME: ${{ secrets.GCP_ARTIFACT_REPO || 'diplomacy-repo' }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          echo "Target Project: $PROJECT_ID"
          echo "Target Region : $REGION"
          echo "Target Service: $SERVICE_NAME"

          IMAGE_TAG="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${SERVICE_NAME}:${{ github.sha }}"

          # Deploy container revision to Cloud Run.
          # --update-env-vars keeps variables set by hand on the service. Only secrets that are
          # configured are sent, so an unset GitHub secret never blanks a value on the service.
          # SUPABASE_KEY is only ever the service role key: the backend refuses to persist with
          # the anon key, because RLS gives anon zero rows and the lobby would drop every game.
          ENV_VARS=""
          add_env() {
            if [ -n "$2" ]; then
              ENV_VARS="${ENV_VARS:+${ENV_VARS},}$1=$2"
            fi
          }
          add_env VITE_SUPABASE_URL "$SUPABASE_URL"
          add_env VITE_SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"
          add_env SUPABASE_URL "$SUPABASE_URL"
          add_env SUPABASE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          add_env SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          add_env SUPABASE_JWT_SECRET "$SUPABASE_JWT_SECRET"
          if [ -n "$SUPABASE_URL" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not set. Game persistence stays off unless the service already has it."
          fi
          ENV_FLAGS=()
          if [ -n "$ENV_VARS" ]; then
            ENV_FLAGS=(--update-env-vars "$ENV_VARS")
          fi

          # --max-instances 1 is required: games live in one process.
          # --timeout 3600 lets a WebSocket stay open for an hour instead of 5 minutes.
          # --cpu-throttling ensures compute charges apply only during active request processing.
          # --cpu-boost temporarily allocates extra CPU during cold-start boot.
          echo "Deploying to Cloud Run with Supabase state persistence..."
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE_TAG" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --cpu 1 \
            --memory 512Mi \
            --cpu-throttling \
            --cpu-boost \
            --port 8080 \
            --timeout 3600 \
            "${ENV_FLAGS[@]}"

          # Extract and report public service URL
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "$PROJECT_ID" --format "value(status.url)")
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Service Name:** \`$SERVICE_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Public URL:** [$SERVICE_URL]($SERVICE_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** \`$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "Live URL: $SERVICE_URL"
