name: CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        run: |
          pytest -v

  frontend-tests:
    name: Frontend Tests & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript typecheck & Vitest
        run: |
          npm test
          npm run build

  deploy:
    name: Deploy to Google Cloud Run
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Deployment Secrets
        run: |
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "::error::Missing secret 'GCP_PROJECT_ID'. Add it under GitHub Repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "::error::Missing secret 'GCP_SA_KEY'. Add it under GitHub Repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Apply Supabase Migrations (Optional)
        if: env.DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL }}
        run: |
          echo "Applying pending migrations to Supabase PostgreSQL..."
          for sql_file in $(ls -1 supabase/migrations/*.sql | sort); do
            echo "--> Running migration: $sql_file"
            psql "$DATABASE_URL" -f "$sql_file"
          done
          echo "All migrations applied successfully."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build & Deploy Unified Container
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          SERVICE_NAME: ${{ secrets.GCP_SERVICE_NAME || 'diplomacy-1901' }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Target Project: $PROJECT_ID"
          echo "Target Region : $REGION"
          echo "Target Service: $SERVICE_NAME"
          
          IMAGE_TAG="gcr.io/${PROJECT_ID}/${SERVICE_NAME}:${{ github.sha }}"
          LATEST_TAG="gcr.io/${PROJECT_ID}/${SERVICE_NAME}:latest"

          # 1. Build and push container with Cloud Build
          echo "Building container with Google Cloud Build..."
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --substitutions="_SUPABASE_URL=${SUPABASE_URL},_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY},_IMAGE_TAG=${IMAGE_TAG}" \
            --project="$PROJECT_ID"

          # 2. Also tag as latest
          gcloud container images add-tag "$IMAGE_TAG" "$LATEST_TAG" --quiet || true

          # 3. Deploy container revision to Cloud Run
          BACKEND_KEY="${SUPABASE_SERVICE_ROLE_KEY:-$SUPABASE_ANON_KEY}"
          echo "Deploying to Cloud Run with Supabase state persistence..."
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE_TAG" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --memory 512Mi \
            --port 8080 \
            --set-env-vars "VITE_SUPABASE_URL=${SUPABASE_URL},VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY},SUPABASE_URL=${SUPABASE_URL},SUPABASE_KEY=${BACKEND_KEY},SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"

          # 4. Extract and report public service URL
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "$PROJECT_ID" --format "value(status.url)")
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Service Name:** \`$SERVICE_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Public URL:** [$SERVICE_URL]($SERVICE_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** \`$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "Live URL: $SERVICE_URL"
