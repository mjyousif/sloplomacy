# GitHub Repository Settings (Configuration as Code)
# Compatible with Probot Settings (https://github.com/probot/settings)

repository:
  name: sloplomacy
  description: "Diplomacy 1901 Tactical Engine & Multiplayer Chancellery"
  topics:
    - diplomacy
    - board-game
    - fast-api
    - react
    - typescript
    - tailwindcss
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: false
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
        require_last_push_approval: false
        dismissal_restrictions: {}
      required_status_checks:
        strict: true
        contexts:
          - "Backend Tests (Pytest)"
          - "Frontend Tests & Build Check"
      enforce_admins: false
      required_conversation_resolution: true
      restrictions: null
