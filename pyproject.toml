[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends/Query/Path)
    "S104",  # possible binding to all interfaces (0.0.0.0 for dev server / Cloud Run)
    "B904",  # within an except clause, raise ... from
]

[tool.ruff.lint.per-file-ignores]
"backend/test_*.py" = ["S101", "S105", "S106", "S311", "B017"]  # Test asserts and test fixtures
"backend/conftest.py" = ["S105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["backend"]
python_files = ["test_*.py"]
