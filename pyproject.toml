[tool.ruff]
target-version = "py310"
line-length = 100

# Phase 1: Baseline exemption so existing backend code is not touched.
# Phase 2 will remove this exclusion and apply formatting and linting all around.
exclude = [
    "backend/*.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"backend/test_*.py" = ["S101"]  # Allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["backend"]
python_files = ["test_*.py"]
