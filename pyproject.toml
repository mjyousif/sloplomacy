[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Phase 2: Formatter is applied repository-wide.
# Lint rule checks are scoped for Phase 3 rule tightening and autofixes.
exclude = [
    "backend/*.py",
]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"backend/test_*.py" = ["S101"]  # Allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["backend"]
python_files = ["test_*.py"]
